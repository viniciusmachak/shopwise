name: shopwise

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shopwise
      POSTGRES_USER: shopwise
      POSTGRES_PASSWORD: shopwise
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwise"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # Pulls the models once; re-running is a no-op when they are already present.
  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 3
        ollama pull ${SHOPWISE_EMBEDDING_MODEL:-nomic-embed-text}
        ollama pull ${SHOPWISE_OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres-data:
  ollama-data:
