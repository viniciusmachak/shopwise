# Production stack for one VM. Run from the deploy/ directory:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: shopwise-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopwise
      POSTGRES_USER: shopwise
      # Required: compose stops with an error if .env.prod doesn't set it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopwise"]
      interval: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-models:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        ollama pull ${SHOPWISE_EMBEDDING_MODEL:-nomic-embed-text}
        # The chat model is only needed when local mode or the local fallback is in use.
        if [ "${SHOPWISE_AI_CHAT_MODE:-cloud}" = local ] || [ "${SHOPWISE_AI_FALLBACK_TO_LOCAL:-true}" = true ]; then
          ollama pull ${SHOPWISE_OLLAMA_CHAT_MODEL:-qwen2.5:7b}
        fi
    restart: "no"

  backend:
    image: ${SHOPWISE_BACKEND_IMAGE:-ghcr.io/viniciusmachak/shopwise-backend}:${SHOPWISE_TAG:-latest}
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Extra Spring settings (e.g. Google sign-in) can go straight into .env.prod.
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SHOPWISE_DB_URL: jdbc:postgresql://postgres:5432/shopwise
      SHOPWISE_DB_USER: shopwise
      SHOPWISE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      SHOPWISE_FRONTEND_URL: ${SHOPWISE_PUBLIC_URL:?set SHOPWISE_PUBLIC_URL in .env.prod}
      SHOPWISE_AI_CHAT_MODE: ${SHOPWISE_AI_CHAT_MODE:-cloud}
      SHOPWISE_AI_FALLBACK_TO_LOCAL: ${SHOPWISE_AI_FALLBACK_TO_LOCAL:-true}
      SHOPWISE_OLLAMA_CHAT_MODEL: ${SHOPWISE_OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SHOPWISE_ADMIN_EMAILS: ${SHOPWISE_ADMIN_EMAILS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOPWISE_MAIL_HOST: ${SHOPWISE_MAIL_HOST:-}
      SHOPWISE_MAIL_PORT: ${SHOPWISE_MAIL_PORT:-587}
      SHOPWISE_MAIL_USERNAME: ${SHOPWISE_MAIL_USERNAME:-}
      SHOPWISE_MAIL_PASSWORD: ${SHOPWISE_MAIL_PASSWORD:-}
      SHOPWISE_MAIL_FROM: ${SHOPWISE_MAIL_FROM:-Shopwise <no-reply@shopwise.local>}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60

  web:
    image: ${SHOPWISE_WEB_IMAGE:-ghcr.io/viniciusmachak/shopwise-web}:${SHOPWISE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SHOPWISE_DOMAIN: ${SHOPWISE_DOMAIN:?set SHOPWISE_DOMAIN in .env.prod}
    ports:
      - "${SHOPWISE_HTTP_PORT:-80}:80"
      - "${SHOPWISE_HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Metrics. Neither is published to the internet: Grafana listens on the VM's localhost only,
  # reach it with an SSH tunnel (ssh -L 3000:localhost:3000 <vm>).
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${SHOPWISE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: shopwise
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: shopwise
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups

  # Copies the local backups to S3-compatible object storage (e.g. Oracle Object Storage)
  # once a day. Only runs with: docker compose --profile offsite ...
  backup-offsite:
    image: rclone/rclone:1.68
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: Other
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - while true; do rclone copy /backups offsite:${BACKUP_S3_BUCKET:-shopwise-backups} && echo synced; sleep 86400; done
    volumes:
      - backups:/backups:ro

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  ollama-data:
  caddy-data:
  caddy-config:
  backups:
