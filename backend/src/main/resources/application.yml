spring:
  application:
    name: shopwise
  config:
    # Local secrets and overrides (API keys, model names) from the repo-root .env, if present.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SHOPWISE_DB_URL:jdbc:postgresql://localhost:5433/shopwise}
    username: ${SHOPWISE_DB_USER:shopwise}
    password: ${SHOPWISE_DB_PASSWORD:shopwise}
  flyway:
    # db/seed holds demo data for local development; production overrides this.
    locations: ${SHOPWISE_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
  data:
    web:
      pageable:
        serialization-mode: via-dto
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  session:
    jdbc:
      initialize-schema: always
    timeout: 30d
  mail:
    host: ${SHOPWISE_MAIL_HOST:localhost}
    port: ${SHOPWISE_MAIL_PORT:1025}
    username: ${SHOPWISE_MAIL_USERNAME:}
    password: ${SHOPWISE_MAIL_PASSWORD:}
  modulith:
    events:
      # Delete handled publications: some events carry short-lived secrets (reset links).
      completion-mode: delete
      jdbc:
        schema-initialization:
          enabled: true
  ai:
    model:
      # Chat models are built by the assistant module (cloud or local mode),
      # so Spring AI's chat auto-configuration stays off.
      chat: none
      embedding: ollama
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${SHOPWISE_EMBEDDING_MODEL:nomic-embed-text}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

springdoc:
  model-converters:
    java-nullable-property-customizer:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

shopwise:
  mail:
    from: ${SHOPWISE_MAIL_FROM:Shopwise <no-reply@shopwise.local>}
  web:
    frontend-url: ${SHOPWISE_FRONTEND_URL:http://localhost:5173}
  ai:
    chat-mode: ${SHOPWISE_AI_CHAT_MODE:local}
    fallback-to-local: ${SHOPWISE_AI_FALLBACK_TO_LOCAL:true}
    local:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${SHOPWISE_OLLAMA_CHAT_MODEL:qwen2.5:7b}
    cloud:
      providers:
        - name: gemini
          base-url: https://generativelanguage.googleapis.com/v1beta/openai
          api-key: ${GEMINI_API_KEY:}
          model: ${SHOPWISE_GEMINI_MODEL:gemini-2.5-flash}
        - name: groq
          base-url: https://api.groq.com/openai/v1
          api-key: ${GROQ_API_KEY:}
          model: ${SHOPWISE_GROQ_MODEL:llama-3.3-70b-versatile}
